name: CI

# Runs on every push and pull request. Uses NO secrets and has read-only permissions,
# so pull requests from forks can never reach deployment credentials.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Integration tests drive a real headless browser through synthetic multi-step application forms.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets
      - name: Migration safety (immutable history, no unreviewed destructive SQL)
        run: npm run db:check
      - name: Migration upgrade test with synthetic data
        run: npm run db:test-upgrade
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  # Generated, never-seen synthetic career sites graded on what the site received (tests/lab).
  # Runs on its own so its browser load does not starve the timing-sensitive integration tests.
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:lab
        env:
          CA_LAB_REPORT: lab-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-report
          path: lab-report.md
          retention-days: 7 # synthetic data only

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 3 # synthetic e2e data only — CI never has access to personal data

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full git history, not just the latest commit
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
